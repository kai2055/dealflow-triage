[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealflow-triage"
version = "0.1.0"
description = "Automated first-pass triage of inbound startup pitches."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pypdfium2>=5", "pillow>=11", "openai==3.35.1", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]